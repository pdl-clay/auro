[workspace]
resolver = "3"
members = [
  "crates/auro",
  "crates/auro-cli",
  "crates/auro-core",
  "crates/auro-ipc",
  "crates/auro-macros",
  "crates/auro-ui",
]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.90"
license = "MIT OR Apache-2.0"
repository = "https://github.com/pdl-clay/auro"
authors = ["The Auro Authors"]
publish = false

[workspace.dependencies]
auro = { path = "crates/auro", version = "0.0.0" }
auro-core = { path = "crates/auro-core", version = "0.0.0" }
auro-ipc = { path = "crates/auro-ipc", version = "0.0.0" }
auro-macros = { path = "crates/auro-macros", version = "0.0.0" }
auro-ui = { path = "crates/auro-ui", version = "0.0.0" }
clap = { version = "4", features = ["derive"] }
dioxus-devtools = { version = "=0.7.10", default-features = false }
gpui = "=0.2.2"
notify = "8"
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
subsecond = "=0.7.10"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "sync", "time"] }
toml = "0.9"
tracing = "0.1"

[profile.release]
strip = "symbols"
panic = "abort"

# `xattr 0.2.3` (gpui -> gpui_http_client -> zed-async-tar) references `libc::ENOATTR`,
# which libc 0.2.191 no longer defines on Linux. The vendored copy maps it to `ENODATA`
# there. Drop this patch when the chain stops pulling xattr 0.2.
[patch.crates-io]
xattr = { path = "vendor/xattr" }
