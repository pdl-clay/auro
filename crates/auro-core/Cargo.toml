[package]
name = "auro-core"
description = "Application model for Auro: config, state and the runtime bridge"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage = "https://pdl-clay.github.io/auro/"
keywords = ["gui", "desktop", "config", "state", "lifecycle"]
categories = ["gui", "config"]
authors.workspace = true
publish = ["crates-io"]

[dependencies]
auro-ipc.workspace = true
interprocess.workspace = true
semver.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
toml.workspace = true
tracing.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[target.'cfg(windows)'.dependencies]
widestring = "1"
windows = { version = "0.61", default-features = false, features = [
  "std",
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_Storage_FileSystem",
  "Win32_System_SystemServices",
  "Win32_System_Threading",
] }

[dev-dependencies]
tempfile.workspace = true
