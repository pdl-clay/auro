[package]
name = "auro-ui"
description = "GPUI re-exports, primitives and tokens for Auro"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage = "https://pdl-clay.github.io/auro/"
keywords = ["gui", "gpui", "ui", "desktop"]
categories = ["gui"]
authors.workspace = true
publish = false

[features]
default = []
test-support = ["gpui/test-support"]

[dependencies]
auro-core.workspace = true
gpui.workspace = true

[dev-dependencies]
gpui = { workspace = true, features = ["test-support"] }
