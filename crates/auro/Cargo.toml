[package]
name = "auro"
description = "Tauri's app model, GPUI's renderer, zero webview"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage = "https://pdl-clay.github.io/auro/"
keywords = ["gui", "desktop", "gpui", "tauri", "framework"]
categories = ["gui", "development-tools"]
authors.workspace = true
publish = ["crates-io"]

[package.metadata.docs.rs]
features = ["services", "tray", "updater"]

[features]
# Experimental in-process hot boundaries (spec 0004). Off by default; `auro dev` relaunches.
hot-reload = ["dep:subsecond", "dep:dioxus-devtools"]
# Signed update manifests and the staged updater runtime (specs 0012, 0013).
updater = ["dep:auro-update"]
# Platform services. Off by default so the facade does not pull OS integrations.
services = ["dep:auro-services"]
# Tray icon support requires the platform services. On Linux it speaks StatusNotifierItem over
# D-Bus and needs no GTK.
tray = ["services", "auro-services/tray"]
# Signed in-process plugin host (stage 1). Off by default; forwards to `auro-core`.
plugins = ["auro-core/plugins"]

[dependencies]
auro-core.workspace = true
auro-ipc.workspace = true
auro-macros.workspace = true
auro-perms.workspace = true
auro-services = { workspace = true, optional = true }
auro-ui.workspace = true
auro-update = { workspace = true, optional = true }
dioxus-devtools = { workspace = true, optional = true }
subsecond = { workspace = true, optional = true }
tokio.workspace = true
tracing.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
# Startup preflight reads the compositor's advertised globals; gpui already pulls this crate.
wayland-client = "0.31"

[[test]]
name = "hot"
required-features = ["hot-reload"]

[dev-dependencies]
auro-ui = { workspace = true, features = ["test-support"] }
gpui = { workspace = true, features = ["test-support"] }
serde_json.workspace = true
tempfile.workspace = true
