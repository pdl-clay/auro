[package]
name = "{{name}}"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"

[dependencies]
auro = {{auro_dependency}}
serde = { version = "1", features = ["derive"] }
{{patch}}

[features]
hot-reload = ["auro/hot-reload"]

# Its own workspace: a parent manifest must never capture the generated app.
[workspace]
