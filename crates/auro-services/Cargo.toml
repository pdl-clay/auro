[package]
name = "auro-services"
description = "Platform services for Auro: autostart, notifications, keychain, shortcuts, tray and deep links"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage = "https://pdl-clay.github.io/auro/"
keywords = ["gui", "desktop", "notifications", "keychain", "tray"]
categories = ["gui", "os"]
authors.workspace = true
publish = false

[package.metadata.docs.rs]
features = ["tray"]

[features]
default = []
tray = ["dep:tray-icon"]

[dependencies]
auto-launch = "0.6"
global-hotkey = "0.10"
keyring = "4"
notify-rust = "4"
thiserror.workspace = true
tray-icon = { version = "0.26", optional = true }

[dev-dependencies]
tempfile.workspace = true
